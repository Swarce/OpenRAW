name: Feature request
description: An idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation or workflow, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How OpenRAW could help, if you have something in mind.
