name: Bug report
description: A DNG that won't open or looks wrong, a crash, or a training problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `openraw --version`
      description: Most bugs so far depended on a library version (tifffile, imagecodecs, OpenCV, PyTorch).
      render: text
    validations:
      required: true
  - type: input
    id: reader
    attributes:
      label: App that failed to open the DNG (if relevant)
      description: Name and version, e.g. "Luminar Neo 1.20" or "Lightroom Classic 14". "Opens in X but not in Y" is especially useful.
  - type: textarea
    id: error
    attributes:
      label: Error message or log
      render: text
  - type: input
    id: source
    attributes:
      label: Source JPEG
      description: Camera model and image dimensions -- or attach the JPEG if you can share it.
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.14
