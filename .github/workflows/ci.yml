name: CI

on:
  push:
    branches: [main]
    paths-ignore:  # docs-only changes are checked by docs.yml instead
      - "**/*.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:  # a newer push cancels the older run on the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Private-repo minutes bill Windows at 2x and macOS at 10x, so the matrix
      # is deliberate: full Python range on Linux, oldest+newest on Windows
      # (3.14 is the main development setup), one macOS job.
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.10" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: ubuntu-latest,  python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest,   python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  adobe-dng-validate:
    # The strictest check available: Adobe's reference DNG validator. libraw is
    # lenient and once let a broken file through that Skia and Luminar rejected.
    name: tests + Adobe dng_validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache dng_validate build
        uses: actions/cache@v6
        with:
          path: .dng_validate_build
          key: dng-validate-${{ runner.os }}-${{ hashFiles('tools/build_dng_validate.sh', 'tools/dng_xmp_sdk_stub.cpp') }}
      - name: Build dng_validate
        run: |
          [ -x .dng_validate_build/dng_validate ] || bash tools/build_dng_validate.sh .dng_validate_build
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test with Adobe validator
        env:
          OPENRAW_DNG_VALIDATE: ${{ github.workspace }}/.dng_validate_build/dng_validate
        run: |
          python -m pytest -q
          # every Adobe test must have RUN, not silently skipped. Match the Adobe
          # tests' own skip reason: other modules' skips (e.g. torch-only tests,
          # reported even when deselected) must not fail this job.
          python -m pytest -q -k adobe_dng_validate -rs | tee adobe.txt
          ! grep -q "dng_validate not available" adobe.txt

  torch:
    # The other jobs don't install PyTorch, so every InvISP, training-loop,
    # multi-process and Kaggle-runner test skips there. CPU wheels keep it fast;
    # training tests use a small network and gloo instead of NCCL.
    name: tests with PyTorch (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Test
        run: |
          python -m pytest -q -rs | tee torch.txt
          # these tests must have RUN here -- skipping them is what this job prevents
          ! grep -qE "could not import 'torch'|needs torch installed" torch.txt

  package:
    # Build the wheel and install it into a CLEAN venv with a fresh dependency
    # resolve -- that's how the tifffile-version bug was found.
    name: build + install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in clean venv and convert a photo
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/openraw "$GITHUB_WORKSPACE/examples/test_source.jpg" -o /tmp/out.dng
          test -s /tmp/out.dng
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
