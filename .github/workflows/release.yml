name: Release

# Desktop app builds for Windows, macOS (Apple silicon) and Linux, plus the
# Python wheel. A pushed tag v* builds everything, smoke-tests each app
# (converts a sample with every bundled model) and publishes a GitHub release;
# running it by hand only builds and uploads the artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   os: windows-latest, torch: "--index-url https://download.pytorch.org/whl/cpu" }
          - { name: macos-arm64,   os: macos-14,       torch: "" }
          - { name: linux-x64,     os: ubuntu-22.04,   torch: "--index-url https://download.pytorch.org/whl/cpu" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch ${{ matrix.torch }}
          python -m pip install ".[gui]" pyinstaller
      - name: Build
        run: pyinstaller --noconfirm packaging/openraw.spec
      - name: Smoke test (convert a sample with every model)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          OPENRAW_SELFTEST_REQUIRE: e14,nikon,classical
        run: |
          case "$RUNNER_OS" in
            Windows) powershell -Command '$p = Start-Process -FilePath "dist\OpenRAW\OpenRAW.exe" -ArgumentList "--selftest","selftest" -Wait -PassThru; exit $p.ExitCode' ;;
            macOS)   dist/OpenRAW.app/Contents/MacOS/OpenRAW --selftest selftest ;;
            Linux)   dist/OpenRAW/OpenRAW --selftest selftest ;;
          esac
          status=$?
          cat selftest/selftest.log || true
          exit $status
      - name: Package
        shell: bash
        run: |
          VERSION=$(python -c "import openraw; print(openraw.__version__)")
          NAME="OpenRAW-${VERSION}-${{ matrix.name }}"
          mkdir out
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip -mx=7 "../out/${NAME}.zip" OpenRAW > /dev/null) ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent dist/OpenRAW.app "out/${NAME}.zip" ;;
            Linux)   tar -C dist -czf "out/${NAME}.tar.gz" OpenRAW ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v6
        with:
          name: app-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  wheel:
    name: wheel + sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: python
          path: dist/*

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          TAG="${GITHUB_REF_NAME}"
          PRE=""
          case "$TAG" in *a*|*b*|*rc*|*dev*) PRE="--prerelease" ;; esac
          gh release create "$TAG" assets/* $PRE --title "OpenRAW ${TAG#v}" --notes-file packaging/release-notes.md
